<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320">
  <!-- Paper grain for the beige page: fine speckle over a slower, cloudy mottle. Tiles seamlessly. -->
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 .35  0 0 0 0 .27  0 0 0 0 .16  0 0 0 -1.6 1"/>
  </filter>
  <filter id="mottle" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".025" numOctaves="2" seed="8" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 .45  0 0 0 0 .35  0 0 0 0 .2  0 0 0 -1.2 .62"/>
  </filter>
  <rect width="320" height="320" filter="url(#mottle)" opacity=".15"/>
  <rect width="320" height="320" filter="url(#grain)" opacity=".55"/>
</svg>
